<!doctype html>
<html ng-app="app" lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Зеркало Говнокод.ру на время набегов спамботов, ошибок Application halted by exception и т.п.">
    <title>Neon Neon Genesis Govnokod</title>
    <link rel="preconnect" href="https://www.gravatar.com/">
    <link rel="preload" href="/comments.html" as="fetch" type="text/html" crossorigin="anonymous">
    <script>
        function getPreloadLink() {
            const BASE_LINK = '/api/comments'
            let link = BASE_LINK;
            
            function getSelectedBanSources() {
                return (Object.entries(JSON.parse(localStorage.getItem('banSources') || '{}'))
                    .filter((obj) => obj[1].selected)
                    .map((obj) => obj[0])
                );
            }

            const banSources = getSelectedBanSources();
            
            if (banSources.length > 0) {
                if (link == BASE_LINK) {
                    link += '?'
                } else {
                    link += '&'
                }
                link += 'ban_sources=' + encodeURI(JSON.stringify(banSources));
            }

            const ignoredPosts = JSON.parse(localStorage.getItem('ignoredPosts') || '{}');
            let ignorePosts = [];
            for (let k in ignoredPosts) {
                ignorePosts.push(k);
            }

            ignorePosts = ignorePosts.join(",");
            if (ignorePosts) {
                if (link == BASE_LINK) {
                    link += '?'
                } else {
                    link += '&'
                }
                link += 'ignore_p=' + ignorePosts;
            }

            const ignoredUsers = JSON.parse(localStorage.getItem('ignoredUsers') || '{}');
            let ignoreUsers = [];
            for (let k in ignoredUsers) {
                ignoreUsers.push(k);
            }

            const defaultSettings = JSON.stringify({
                'id': '',
                'syncServerList': false,
                'syncServerStrict': false,
            });
            const moderatorSettings = JSON.parse(localStorage.getItem('moderatorSettings') || defaultSettings);

            if (banSources.indexOf(moderatorSettings.id) < 0 || !moderatorSettings.syncServerList) {
                ignoreUsers = ignoreUsers.join(",");
                if (ignoreUsers) {
                    if (link == BASE_LINK) {
                        link += '?'
                    } else {
                        link += '&'
                    }
                    link += 'ignore_u=' + ignoreUsers;
                }
            }

            return link;
        }
        // Yep, this is extremely dirty, whatever.
        document.write('<link rel="preload" href="' + getPreloadLink() + '" as="fetch" type="text/json" crossorigin="anonymous">');
    </script>
    <link rel="preload" href="/img/logo.webp" as="image">
    <link rel="shortcut icon" href="/img/favicon.ico">
    <link rel="icon" type="image/x-icon" href="/img/favicon.ico" sizes="200x200">
    <script src="angular.min.js?v=1.8.2"></script>
    <script src="angular-route.min.js?v=1.8.2"></script>
    <script src="socket.io.min.js?v=4.1.3"></script>
    <script src="nacl.min.js?v=1.0.3"></script>
    <script src="ngk.js?v=1.0.0"></script>
    <style>
.header {
    border: 1px solid #C0C0C0;
    border-radius: 5px;
    margin-bottom: 20px;
    margin-top: 20px;
    padding: 5px;
}

.comment {
    position: relative;
    margin-top: 10px;
    margin-bottom: 5px;
    min-height: 74px;
    border: 1px solid #C0C0C0;
    border-radius: 5px;
    min-width: 60%;
}

.comment .avatar {
    display: inline-block;
    position: absolute;
    left: 5px;
    top: 5px;
    width: 48px;
    height: 48px;
    border: 1px solid #C0C0C0;
}

.comment .content {
    margin-left: 64px;
}

.comment .info {
    margin-top: 5px;
    margin-bottom: 5px;
}

.comment .text {
    margin-bottom: 5px;
}

.nested-comment {
    margin-left: 20px;
}

.nested-comment .content {
    min-height: 48px;
}

.comment .ignore {
    color: black;
    text-decoration: none;
}

.comment.new {
    background-color: #e0ffe0;
}

pre {
    max-width: 100%;
    overflow: auto;
}


.comment-popup {
    background-color: white;
    border: 1px solid black;
    border-radius: 5px;
    padding: 5px;
    position: absolute;
    width: 90%;
}

body {
    overflow-x: auto;
}

.alert {
  padding: 20px;
  background-color: #f44336;
  color: white;
}

.closebtn {
  margin-left: 15px;
  color: white;
  font-weight: bold;
  float: right;
  font-size: 22px;
  line-height: 20px;
  cursor: pointer;
  transition: 0.3s;
}

.closebtn:hover {
  color: black;
}

.autocompletion-list {
    position: absolute;
    border: thin solid #c0c0c0;
    background: white;
    list-style: none;
    padding: 0;
    margin: 0;
    outline: 0;
    box-sizing: border-box;
}

.autocompletion-item {
    cursor: pointer;
    position: relative;
    padding: 3px 1em 3px .4em;
    user-select: none;
}

.autocompletion-item:hover {
    background-color: #e0ffe0;
}

.autocompletion-list-item:focus {
    background-color: #c0ffc0;
}

.modLabel {
    display: inline-block;
    clear: left;
    width: 9em;
    text-align: left;
}
.modInput {
  display: inline-block;
  width: min(40em, calc(100% - 12em));
}

.noselect {
  -webkit-touch-callout: none; /* iOS Safari */
    -webkit-user-select: none; /* Safari */
     -khtml-user-select: none; /* Konqueror HTML */
       -moz-user-select: none; /* Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
            user-select: none; /* Non-prefixed version, currently
                                  supported by Chrome and Opera */
}

</style>
</head>
<body>
    <script type="text/ng-template" id="comment-template-base">
        <img ng-src="{{comment.avatar_url}}" alt="Аватар {{comment.user_name}}" class="avatar" onerror="this.onerror = null; this.src = '/img/default.png';">
        <div class="content">
            <div class="info">
                <a href="/#!/search?user={{comment.user_name}}" target="_blank">{{comment.user_name}}</a>#<a href="https://govnokod.ru/user/{{comment.user_id}}">{{comment.user_id}}</a>
                (<a href="/#!/replies/{{comment.user_name}}">R</a>)
                <a href="" ng-click="ignoreUser(comment.user_id, comment.user_name)" class="ignore" title="Забанить {{comment.user_name}}">&#x2613;</a>
                насрал в
                <a href="https://govnokod.ru/{{comment.post_id}}#comment{{comment.id}}">#{{comment.post_id}}</a>
                <a href="" ng-click="ignorePost(comment.post_id)" class="ignore" title="Забанить пост">&#x2613;</a>
                (<a href="/#!/{{comment.post_id}}#comment{{comment.id}}">NGK</a>,
                    <a ng-if="comment.id_xyz == null" href="https://govnokod.xyz/_{{comment.post_id}}">XYZ</a>
                    <a ng-if="comment.id_xyz != null" href="https://govnokod.xyz/_{{comment.post_id}}/#comment-{{comment.id_xyz}}">XYZ</a>)
                ({{comment.posted_local}})
                <span ng-bind-html="comment.source"></span>
                <ngk-comment-popup comment-id="{{comment.parent_id}}" post-id="{{comment.post_id}}" />
            </div>
            <div class="text" ng-bind-html="comment.text"></div>
        </div>
    </script>

    <script type="text/ng-template" id="post-template-base">
        <img ng-src="{{post.avatar_url}}" alt="Аватар {{post.user_name}}" class="avatar" onerror="this.onerror = null; this.src = '/img/default.png';">
        <div class="content">
            <div class="info">
                <a href="/#!/search?user={{post.user_name}}" target="_blank">{{post.user_name}}</a>#<a href="https://govnokod.ru/user/{{post.user_id}}">{{post.user_id}}</a>
                (<a href="https://govnokod.ru/user/{{post.user_id}}">U</a>)
                высрал 
                <a href="https://govnokod.ru/{{post.id}}">#{{post.id}}</a>
                <a href="" ng-click="ignorePost(post.id)" class="ignore" title="Забанить пост">&#x2613;</a>
                (<a href="#!/{{post.id}}">NGK</a>,
                    <a href="https://govnokod.xyz/_{{post.id}}">XYZ</a>)
                ({{post.posted_local}})
                <span ng-bind-html="post.source"></span>
            </div>
            <pre>{{post.code}}</pre>
            <div class="text" ng-bind-html="post.text"></div>
        </div>
    </script>
    <div ng-view class="main"></div>
</body>
