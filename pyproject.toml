[project]
name = 'ngk'
version = '0.1.0'
description = 'gcode.space'
requires-python = '>=3.14'
dependencies = [
    'flask>=3.1',
    'flask-socketio>=5.5',
    'gevent>=25.9',
    'lxml>=6.0',
    'pyhocon>=0.3.61',
    'pynacl>=1.6',
    'python-decouple>=3.8',
    'redis>=6.2',
    'requests>=2.32',
    'sqlalchemy>=2.0',
    'sqlalchemy-utils>=0.41',
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    'pytest>=8.0',
]
server = [
    'uwsgi==2.0.31; os_name == "posix"',
]

[[tool.uv.dependency-metadata]]
name = 'uwsgi'
version = '2.0.31'
requires-dist = []

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/ngk']

[tool.ruff]
line-length = 110
